aid: ellipsis
name: Ellipsis
description: >-
  Ellipsis is a managed cloud platform for running autonomous coding agents at
  scale. Engineering teams define agents as YAML config files that live in their
  repositories, and Ellipsis runs them in isolated, ephemeral sandboxes to review
  pull requests, fix bugs, build features, and investigate production issues.
  Agents trigger automatically on cron schedules, GitHub pull-request lifecycle
  events, or @ellipsis-dev mentions, and can also be launched on demand from the
  dashboard, the REST API, or the `agent` CLI. The platform runs Claude, Codex,
  and Gemini models, enforces hard budget caps and scoped per-session credentials,
  retains zero source code, and provides full observability with audit trails and
  replayable execution. Ellipsis (YC W24) serves 400+ engineering teams across
  67,000+ connected repositories.
